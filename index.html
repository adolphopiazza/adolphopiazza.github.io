<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Adolpho Piazza - iOS Developer</title>
    <style>
        /* --- CSS Reset and Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Uses the native system font stack, similar to Apple's approach */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fbfbfd; /* A very very light gray, common in Apple backgrounds */
            background-image: linear-gradient(to bottom, #ffffff, #f5f5f7);
            color: #1d1d1f; /* Apple's standard nearly-black text color */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* --- Main Container --- */
        .profile-container {
            max-width: 600px;
            width: 100%;
            /* Optional: Adds a subtle "card" effect, remove these three lines for a flatter look */
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); /* Glassmorphism effect */
            padding: 4rem 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* --- Illustration Styling --- */
        .illustration-container {
            max-width: 200px;
            margin: 0 auto 2.5rem auto;
        }
        
        /* Makes the SVG responsive */
        .illustration-container svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        /* --- Typography --- */
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            /* Subtle gradient text effect often visible on Apple marketing pages */
            background: -webkit-linear-gradient(#1d1d1f, #4a4a4c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #86868b; /* Apple's secondary text gray */
        }

        /* --- Footer --- */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #86868b;
        }

        /* Mobile Tweak */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            .profile-container {
                 padding: 3rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <main class="profile-container">
        <div class="illustration-container">
            <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect x="10" y="10" width="180" height="380" rx="30" ry="30" fill="#3a3a3c" stroke="#1d1d1f" stroke-width="4"/>
                <rect x="20" y="20" width="160" height="360" rx="25" ry="25" fill="url(#screenGradient)"/>
                 <rect x="60" y="28" width="80" height="20" rx="10" ry="10" fill="#000000"/>
                <rect x="35" y="70" width="35" height="35" rx="8" fill="#007AFF" opacity="0.8"/> <rect x="82.5" y="70" width="35" height="35" rx="8" fill="#34C759" opacity="0.8"/> <rect x="130" y="70" width="35" height="35" rx="8" fill="#FF9500" opacity="0.8"/> <rect x="35" y="130" width="130" height="10" rx="5" fill="#d1d1d6"/>
                <rect x="35" y="150" width="100" height="10" rx="5" fill="#d1d1d6"/>
                <rect x="35" y="170" width="110" height="10" rx="5" fill="#d1d1d6"/>
            </svg>
        </div>

        <h1>Adolpho Piazza</h1>
        <h2>iOS Developer</h2>
    </main>

    <footer>
        © 2026 Adolpho Piazza. All rights reserved.
    </footer>

</body>
</html>
